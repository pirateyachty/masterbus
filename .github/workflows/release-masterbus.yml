name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,       os: ubuntu-latest,  packages: "",                       rustflags: "" }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest,  packages: gcc-arm-linux-gnueabihf, rustflags: "" }
          - { target: aarch64-unknown-linux-gnu,      os: ubuntu-latest,  packages: gcc-aarch64-linux-gnu,   rustflags: "" }
          - { target: x86_64-pc-windows-msvc,        os: windows-latest, packages: "",                       rustflags: "-C target-feature=+crt-static" }
          - { target: aarch64-apple-darwin,           os: macos-latest,   packages: "",                       rustflags: "" }
          - { target: x86_64-apple-darwin,            os: macos-latest,   packages: "",                       rustflags: "" }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release workspace
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Stage full artifacts
        shell: bash
        run: |
          out="target/${{ matrix.target }}/release"
          dist="masterbus-${{ matrix.target }}"
          mkdir -p "$dist"

          cp crates/masterbus-ffi/include/masterbus.h "$dist/"

          for b in masterbus-tui masterbus-set-field; do
            if [ -f "$out/$b.exe" ]; then
              cp "$out/$b.exe" "$dist/"
            else
              cp "$out/$b" "$dist/"
            fi
          done

          for f in             libmasterbus_ffi.so             libmasterbus_ffi.dylib             libmasterbus_ffi.a             masterbus_ffi.dll             masterbus_ffi.dll.lib             masterbus_ffi.lib
          do
            [ -f "$out/$f" ] && cp "$out/$f" "$dist/"
          done

          case "${{ matrix.target }}" in
            *linux*)
              cp "$out/masterbus-signalk" "$dist/"
              cp crates/masterbus-tools/etc/masterbus-signalk.service "$dist/"
              ;;
          esac

          tar czf "${dist}.tar.gz" "$dist"
          echo "DIST=$dist" >> "$GITHUB_ENV"

      - name: Upload full release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST }}
          path: ${{ env.DIST }}.tar.gz

      - name: Attach full release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST }}.tar.gz

      - name: Package masterbus-signalk appliance runtime
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          out="target/aarch64-unknown-linux-gnu/release"
          dist="masterbus-signalk-aarch64-unknown-linux-gnu"
          mkdir -p "$dist"

          cp "$out/masterbus-signalk" "$dist/"
          cp crates/masterbus-tools/etc/masterbus-signalk.service "$dist/"

          cat > "$dist/README.txt" <<'EOF'
          masterbus-signalk runtime package

          Host-local files are intentionally NOT included:
            - masterbus-signalk-fields.toml
            - MasterBus config.ini

          Keep those files on the target host when upgrading the binary.
          EOF

          tar czf "${dist}.tar.gz" "$dist"
          sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"

      - name: Upload appliance artifact
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: masterbus-signalk-aarch64-unknown-linux-gnu
          path: |
            masterbus-signalk-aarch64-unknown-linux-gnu.tar.gz
            masterbus-signalk-aarch64-unknown-linux-gnu.tar.gz.sha256

      - name: Attach appliance runtime assets
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            masterbus-signalk-aarch64-unknown-linux-gnu.tar.gz
            masterbus-signalk-aarch64-unknown-linux-gnu.tar.gz.sha256
