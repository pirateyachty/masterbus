name: Build appliance

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install ARM64 linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: appliance-aarch64

      - name: Build appliance binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build \
            --release \
            -p masterbus-tools \
            --bin masterbus-dump \
            --target aarch64-unknown-linux-gnu

      - name: Package
        run: |
          TARGET="aarch64-unknown-linux-gnu"
          OUT="target/$TARGET/release"
          DIST="masterbus-dump-$TARGET"

          mkdir -p "$DIST"

          cp "$OUT/masterbus-dump" "$DIST/"

          cat > "$DIST/README.txt" <<'EOF'
          MasterBus dump utility

          Included:
            - masterbus-dump
          EOF

          tar czf "$DIST.tar.gz" "$DIST"
          sha256sum "$DIST.tar.gz" > "$DIST.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: masterbus-signalk-aarch64-unknown-linux-gnu
          path: |
            masterbus-dump-aarch64-unknown-linux-gnu.tar.gz
            masterbus-dump-aarch64-unknown-linux-gnu.tar.gz.sha256
