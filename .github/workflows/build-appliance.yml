name: Build appliance

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install ARM64 linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu

      - name: Build masterbus-signalk
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build \
            --release \
            -p masterbus-tools \
            --bin masterbus-signalk \
            --target aarch64-unknown-linux-gnu

      - name: Package runtime
        run: |
          out="target/aarch64-unknown-linux-gnu/release"
          dist="masterbus-signalk-aarch64-unknown-linux-gnu"

          mkdir -p "$dist"

          cp "$out/masterbus-signalk" "$dist/"
          cp crates/masterbus-tools/etc/masterbus-signalk.service "$dist/"

          cat > "$dist/README.txt" <<'EOF'
          masterbus-signalk runtime package

          Host-local files are intentionally NOT included:
            - masterbus-signalk-fields.toml
            - MasterBus config.ini
          EOF

          tar czf "${dist}.tar.gz" "$dist"
          sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"

      - name: Upload appliance artifact
        uses: actions/upload-artifact@v4
        with:
          name: masterbus-signalk-aarch64-unknown-linux-gnu
          path: |
            masterbus-signalk-aarch64-unknown-linux-gnu.tar.gz
            masterbus-signalk-aarch64-unknown-linux-gnu.tar.gz.sha256
